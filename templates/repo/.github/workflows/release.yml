name: Release

on:
  push:
    tags: ['v*']

permissions: {}

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # create the GitHub Release
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # The guard stays: pushing a tag twice, or re-running the workflow, must not fail.
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            echo "Release ${GITHUB_REF_NAME} already exists — skipping."
            exit 0
          fi
          # The Release owns nothing of its own: release-notes.sh copies the three lines the version
          # opens on, then the auto-generated pull-request list. It fails rather than print half a
          # note, so a missing half stops the release instead of shipping quietly incomplete.
          ./release-notes.sh "${GITHUB_REF_NAME}" > "${RUNNER_TEMP}/notes.md"
          gh release create "${GITHUB_REF_NAME}" --title "${GITHUB_REF_NAME}" --notes-file "${RUNNER_TEMP}/notes.md"
