name: Publish image

# ⚠ `build-check` is a REQUIRED check, so its job name must not move — and that rules out a
# `strategy.matrix` on it: a matrix renames it to `build-check (backend)`, `build-check (frontend)`…
# and the name the ruleset waits for never reports, leaving every pull request stuck on
# "Expected — waiting for status". Several images to build? LOOP inside this one job. `build-push`,
# further down, is NOT a required check — a matrix there is fine, and keeps the slow multi-arch
# builds parallel.

on:
  push:
    tags: ['v*']
  pull_request:
    # BOTH branches: with `staging`, the flow is feat/ -> develop -> main and the ruleset makes
    # `build-check` REQUIRED on `develop` too — main-only would strand every PR there on "Expected
    # — waiting for status". Harmless without `staging`: the branch never matches.
    branches: [main, develop]
  schedule:
    - cron: '0 4 * * 1'   # weekly: re-scans the PUBLISHED image (see `scheduled-scan` below)

permissions: {}

# Pinned ONCE for both scanning jobs. Two copies would drift, and Renovate's regex manager expects
# this exact VERSION/SHA256 pair — it bumps them together, in a single pull request.
env:
  TRIVY_VERSION: v0.73.0
  TRIVY_SHA256: 2edd39da482bb4e9831962487b68f68e3928ec3137794757f54d00383d79547b

jobs:
  build-check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write   # write the GHA layer cache
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # No Dockerfile yet? The JOB still must run and go green — `build-check` is a REQUIRED check,
      # and one that never reports strands the PR. Only the steps below are conditional.
      - name: No Dockerfile yet (scaffolded repo)
        if: hashFiles('Dockerfile') == ''
        run: echo "No Dockerfile yet — nothing to build or scan. These steps activate once it exists."
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
        if: hashFiles('Dockerfile') != ''
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        if: hashFiles('Dockerfile') != ''
        with:
          context: .
          push: false
          load: true           # keep the image in the local daemon so Trivy can scan it
          tags: candidate:pr
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # Raw binary, NOT aquasecurity/trivy-action — its tags are mutable and have been force-pushed.
      # Same discipline as gitleaks/actionlint below: pinned binary + checksum, one pattern only.
      - name: Install Trivy (pinned + checksum-verified)
        if: hashFiles('Dockerfile') != ''
        run: |
          set -euo pipefail
          v="${TRIVY_VERSION#v}"   # the tag carries the `v`, the asset name does not
          f="trivy_${v}_Linux-64bit.tar.gz"
          curl -sSfL -o "$f" \
            "https://github.com/aquasecurity/trivy/releases/download/${TRIVY_VERSION}/${f}"
          echo "${TRIVY_SHA256}  ${f}" | sha256sum -c -
          tar -xzf "$f" trivy
      # CRITICAL/HIGH only (MEDIUM on a base image is permanent noise) and --ignore-unfixed (a
      # vulnerability with no patch cannot be acted on): a gate, rather than an alarm nobody reads.
      - name: Scan the image (fails on CRITICAL/HIGH)
        if: hashFiles('Dockerfile') != ''
        run: |
          set -euo pipefail
          ./trivy image --scanners vuln --severity CRITICAL,HIGH \
            --ignore-unfixed --exit-code 1 --no-progress candidate:pr

  # `build-check` scans a CANDIDATE image on PR; nothing re-scans the PUBLISHED one afterward.
  # Renovate covers a moving base tag, not a base line that stopped being rebuilt — no release,
  # no PR, no scan, while the registry keeps shipping the CVE. Hence this weekly look, same flags.
  # ⚠ `schedule` only ever runs from the DEFAULT branch — a PR that stops at `develop` never arms
  # it. ⚠ GitHub disables scheduled workflows after 60 days of repo inactivity (the exact case this
  # guards); Renovate's weekly PRs keep it awake, otherwise re-enable it by hand from Actions.
  scheduled-scan:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read   # reading OWN package, which may be private by default under an organisation
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/<image-name>:latest
    steps:
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Install Trivy (pinned + checksum-verified)   # raw binary, see `build-check` above
        run: |
          set -euo pipefail
          v="${TRIVY_VERSION#v}"
          f="trivy_${v}_Linux-64bit.tar.gz"
          curl -sSfL -o "$f" \
            "https://github.com/aquasecurity/trivy/releases/download/${TRIVY_VERSION}/${f}"
          echo "${TRIVY_SHA256}  ${f}" | sha256sum -c -
          tar -xzf "$f" trivy
      - name: Scan the published image (fails on CRITICAL/HIGH)
        run: |
          set -euo pipefail
          # Nothing published yet? A repo gets this workflow before its first `v*` tag — skip rather
          # than go red every Monday (the login step above already fails loudly on a broken token).
          if ! docker manifest inspect "$IMAGE" >/dev/null 2>&1; then
            echo "::notice::$IMAGE is not published yet — nothing to scan."
            exit 0
          fi
          # Same two narrowings as the build-check scan above, for the same reason.
          ./trivy image --scanners vuln --severity CRITICAL,HIGH \
            --ignore-unfixed --exit-code 1 --no-progress "$IMAGE"

  build-push:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      actions: write
      id-token: write       # cosign keyless signing: the OIDC token IS the identity
      attestations: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # QEMU: needed to build the arm64 image on an amd64 runner. Only on the PUBLISH job —
      # `build-check` stays amd64-only, so pull requests keep their short feedback loop.
      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        id: meta
        with:
          images: ghcr.io/${{ github.repository_owner }}/<image-name>
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        id: build
        with:
          context: .
          push: true
          # The point of this capability: SOMEONE ELSE deploys the image. amd64-only means a
          # Raspberry Pi or Apple-silicon host hits `no matching manifest for linux/arm64/v8` at
          # `docker pull`, with no warning. Costs 2-4 min here (QEMU emulation); nothing on PRs.
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # SBOM + SLSA provenance, attached to the manifest: whoever deploys can answer "what's
          # inside, what built it" WITHOUT trusting this repo — the point of shipping to someone
          # else. Costs seconds.
          provenance: mode=max
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      # Keyless: the signing identity IS this workflow's OIDC token (Fulcio transparency log) — no
      # private key to rotate, and a signature proves WHICH repo's workflow built the image.
      # ⚠ Signed BY DIGEST, not by tag (a tag can be re-pointed). Verify before deploying:
      #   cosign verify --certificate-oidc-issuer https://token.actions.githubusercontent.com \
      #     --certificate-identity-regexp 'https://github.com/<owner>/<repo>/' <image>:<tag>
      - name: Sign the image (keyless)
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/<image-name>
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"

  # The GitHub Release lives HERE, not in release.yml — `needs` cannot cross workflows, and with
  # `artefact` the release ANNOUNCES an image: publishing before `build-push` succeeds would hand
  # out a version pointing at nothing. init-project.sh ships release.yml only WITHOUT this
  # capability — keeping both and relying on the idempotency guard fails, since both start on the
  # same tag and whichever wins the race decides.
  release:
    needs: build-push
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write   # create the GitHub Release
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # The guard stays: pushing a tag twice, or re-running the workflow, must not fail.
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            echo "Release ${GITHUB_REF_NAME} already exists — skipping."
            exit 0
          fi
          # Whoever deploys this reads the release, not the workflow, so the pinned image reference
          # comes FIRST. Under it, release-notes.sh puts the two links a note owes; the written half
          # is added by hand afterwards, a tag push having nothing to write.
          # The fences are escaped inside a DOUBLE-quoted string: in a single-quoted one, shellcheck
          # reads them as a command substitution that will not expand (SC2016) and fails the lint.
          {
            echo "## Image"
            echo
            echo "\`\`\`yaml"
            echo "image: ghcr.io/${GITHUB_REPOSITORY_OWNER}/<image-name>:${GITHUB_REF_NAME#v}"
            echo "\`\`\`"
            echo
            ./release-notes.sh "${GITHUB_REF_NAME}"
          } > "${RUNNER_TEMP}/notes.md"
          gh release create "${GITHUB_REF_NAME}" --title "${GITHUB_REF_NAME}" --notes-file "${RUNNER_TEMP}/notes.md"
