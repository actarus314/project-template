name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    paths: ['<web-dir>/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    # GitHub Pages requires a paid plan on a PRIVATE repo: the deploy fails on every push
    # ("Resource not accessible by integration"). Skipped while private, publishes on its own
    # once the repo goes public. `!= 'private'` (not `== 'public'`) so a missing field means
    # "run", never "silently stop deploying".
    if: github.event.repository.visibility != 'private'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # If the entry file isn't index.html, copy it at deploy time (nothing committed):
      # - run: cp <web-dir>/app.html <web-dir>/index.html
      - uses: actions/configure-pages@v6
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v5
        with:
          path: <web-dir>
      - id: deployment
        uses: actions/deploy-pages@v5
