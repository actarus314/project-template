# TOOLCHAIN `node` (npm, tests, types) — this is what `--type` decides, and the ONLY thing it
# decides. Hosting and packaging are separate capabilities. Installed as .github/workflows/ci.yml by
# `init-project.sh --type node`. Job name MUST stay `checks` (the ruleset requires it).
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions: {}

jobs:
  checks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      GITLEAKS_VERSION: v8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
      ACTIONLINT_VERSION: v1.7.12
      ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
      OSV_VERSION: v2.4.0
      OSV_SHA256: 15314940c10d26af9c6649f150b8a47c1262e8fc7e17b1d1029b0e479e8ed8a0
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false   # the token has no reason to linger in .git/config
          fetch-depth: 0     # gitleaks scans full history
      # Blocks a vulnerable/badly-licensed dependency BEFORE the merge. Dependabot only alerts
      # AFTER it has landed on the default branch — the two are complementary, not redundant.
      # Requires the dependency graph, which on a PRIVATE repo needs GitHub Advanced Security:
      # "Dependency review is not supported on this repository" — it would fail on EVERY pull
      # request for the whole private phase (i.e. the whole development), and a permanently red CI
      # stops being read. Same gate, same treatment as CodeQL and Pages: skipped while private,
      # wakes up on its own once the repo goes public.
      # `!= 'private'` (never `== 'public'`): a missing field means RUN, never "silently off".
      - name: Dependency review (PR only, public repo only)
        if: github.event_name == 'pull_request' && github.event.repository.visibility != 'private'
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
      - uses: actions/setup-node@v6
        with:
          node-version: '20'
      # A freshly scaffolded repo has no package.json yet. A REQUIRED check that cannot possibly
      # pass on the scaffold is a structural red — the very thing that makes a CI stop being read.
      # These steps wake up on their own as soon as the manifest exists.
      - name: No package.json yet (scaffolded repo)
        if: hashFiles('package.json') == ''
        run: echo "No package.json yet — nothing to check. These steps activate once it exists."
      - run: npm ci
        if: hashFiles('package.json') != ''
      - run: npm test
        if: hashFiles('package.json') != ''
      - run: npm run typecheck
        if: hashFiles('package.json') != ''
      # No `npm audit` here, and that is deliberate. It was a STRICT SUBSET of the osv-scanner step
      # further down: same advisory database (npm audit has been powered by the GitHub Advisory
      # Database since 2021; OSV aggregates GHSA too), same lockfile, same job, same moment — and
      # `--omit=dev` made it narrower still. Measured on lodash@4.17.21 + minimist@1.2.5 (2026-07-14):
      # `npm audit` reported 2 advisories, osv-scanner reported the SAME TWO — same GHSA ids — plus
      # one more that `npm audit` missed entirely. A second scanner that finds a subset of the first
      # adds no signal; it only adds a step to maintain, and a false sense of depth.
      # Raw binary, not gitleaks/gitleaks-action: the action requires a licence key for
      # ORGANISATION-owned repositories. The binary needs none — same for personal and org.
      - name: Install gitleaks (pinned + checksum-verified)
        run: |
          set -euo pipefail
          v="${GITLEAKS_VERSION#v}"   # the tag carries the `v`, the asset name does not
          f="gitleaks_${v}_linux_x64.tar.gz"
          curl -sSfL -o "$f" \
            "https://github.com/gitleaks/gitleaks/releases/download/${GITLEAKS_VERSION}/${f}"
          echo "${GITLEAKS_SHA256}  ${f}" | sha256sum -c -
          tar -xzf "$f" gitleaks
      - name: Secret scan (full history)
        run: ./gitleaks git --no-banner --redact
      # The workflows are code too, and the likeliest attack path here: a `${{ }}` expression
      # interpolated straight into a `run:` block is a shell injection.
      # actionlint = syntax + shellcheck; zizmor = security lint. Both pinned.
      - name: Lint workflows (actionlint, pinned + checksum-verified)
        run: |
          set -euo pipefail
          v="${ACTIONLINT_VERSION#v}"
          f="actionlint_${v}_linux_amd64.tar.gz"
          curl -sSfL -o "$f" \
            "https://github.com/rhysd/actionlint/releases/download/${ACTIONLINT_VERSION}/${f}"
          echo "${ACTIONLINT_SHA256}  ${f}" | sha256sum -c -
          tar -xzf "$f" actionlint
          ./actionlint -color
      # Semgrep + osv-scanner — pourquoi les DEUX, et ce que chacun fait VRAIMENT.
      #
      # semgrep = la SEULE analyse statique du CODE qui tourne en PRIVÉ. CodeQL y est interdit par
      #   LICENCE (pas par une limite technique), et un repo passe toute sa jeunesse en privé : sans
      #   semgrep, le code n'est JAMAIS analysé jusqu'au flip, où CodeQL déverse tout l'arriéré.
      #   ⚠ NE PAS écrire « semgrep attrape ce que CodeQL rate ». C'est la phrase confortable, et elle
      #     n'est ÉTAYÉE PAR RIEN. Semgrep CE est intra-fichier ET intra-fonction — le dataflow
      #     inter-procédural est dans l'édition Pro, payante — là où CodeQL fait du dataflow
      #     cross-fichier. semgrep PRÉCÈDE CodeQL, il ne le dépasse pas. Il est gardé pour la PHASE
      #     PRIVÉE : cette raison suffit, et il n'en faut pas une fausse en plus.
      #
      # osv-scanner = le GATE pré-merge des dépendances.
      #   ⚠ NE PAS écrire « rien d'autre ne voit les vulnérabilités en privé » : Dependabot ALERTS
      #     fonctionne en privé, gratuitement. Mais il alerte APRÈS COUP, sur la branche par défaut —
      #     quand le code est DÉJÀ entré. osv-scanner, lui, BLOQUE LA PR. Rôle différent, pas doublon.
      #     (`dependency-review` est le gate NATIF — mais il exige un repo public, ou GHAS.)
      #   Il n'y a PAS de `npm audit` à côté : c'était un SOUS-ENSEMBLE STRICT d'osv-scanner (même base
      #   GHSA, même lockfile, même job) — retiré le 14/07 après mesure.
      #
      # --exclude=.github : les workflows ont leurs propres linters (actionlint + zizmor), qui appliquent
      #   LA POLITIQUE DE PIN DE CE REPO (SHA pour les actions tierces, tag majeur toléré pour actions/*
      #   et github/* — les compromettre, c'est compromettre GitHub lui-même). Les règles workflow de
      #   semgrep CONTREDISENT cette politique et feraient échouer chaque scaffold dès le 1er jour.
      #   ⚠ NE PAS écrire « one scope each, no overlap » : c'est FAUX depuis avril 2025. CodeQL analyse
      #     désormais le langage `actions` (GA, et ACTIF EN DEFAULT SETUP, sans opt-in) : sa suite par
      #     défaut couvre déjà l'essentiel de zizmor — code-injection, artifact/cache-poisoning,
      #     untrusted-checkout, secrets exposés, missing-workflow-permissions. LE RECOUVREMENT EST RÉEL.
      #     Ce que zizmor garde EN PROPRE, et qui justifie de le garder : la politique de pin du repo
      #     (`zizmor.yml`) — la requête CodeQL `unpinned-tag` est en security-extended, PAS en default —
      #     plus artipacked (persist-credentials), impostor-commit, ref-confusion, typosquat-uses.
      - name: Static analysis (semgrep, pinned)
        run: |
          set -euo pipefail
          python3 -m pip install --quiet -r requirements-ci.txt
          semgrep scan --error --quiet --metrics=off --exclude=.github \
            --config p/security-audit --config p/owasp-top-ten .
      # Same role as dependency-review, but works on a PRIVATE repo (no GHAS needed).
      # Raw binary + checksum, never a third-party action — 75 of trivy-action's 76 tags were
      # force-pushed in March 2026; a tag is mutable, a SHA is not.
      - name: Vulnerable dependencies (osv-scanner, pinned + checksum-verified)
        if: hashFiles('package-lock.json') != ''
        run: |
          set -euo pipefail
          curl -sSfL -o osv-scanner \
            "https://github.com/google/osv-scanner/releases/download/${OSV_VERSION}/osv-scanner_linux_amd64"
          echo "${OSV_SHA256}  osv-scanner" | sha256sum -c -
          chmod +x osv-scanner
          ./osv-scanner scan source --lockfile=package-lock.json
      - name: Audit workflows (zizmor)
        run: |
          set -euo pipefail
          python3 -m pip install --quiet -r requirements-ci.txt
          zizmor --persona regular --config .github/zizmor.yml .github/workflows/
