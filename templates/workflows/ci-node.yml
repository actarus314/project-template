# Installed as .github/workflows/ci.yml by `init-project.sh --type node`.
# ⚠ That also rules out a `strategy.matrix` on this job: a matrix renames the check to
# `checks (backend)`, `checks (frontend)`… so the name the ruleset waits for NEVER reports, and
# every pull request sits forever on "Expected — waiting for status". To cover several
# workspaces, LOOP inside the single job — never fan it out into a matrix.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions: {}

jobs:
  checks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      GITLEAKS_VERSION: v8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
      ACTIONLINT_VERSION: v1.7.12
      ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
      OSV_VERSION: v2.5.1
      OSV_SHA256: f9f25499a2c8cc367b3af45df2ea7eeca7fbccceab9c35079968f4b3652194be
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
      # Requires the dependency graph, unavailable on a private repo without GitHub Advanced
      # Security ("Dependency review is not supported on this repository"). Guarded `!= 'private'`
      # (never `== 'public'`): a missing field must RUN the step, not silently skip it. Skipped
      # while private, wakes up on its own at the public flip.
      - name: Dependency review (PR only, public repo only)
        if: github.event_name == 'pull_request' && github.event.repository.visibility != 'private'
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      # A freshly scaffolded repo has no package.json yet — a REQUIRED check that can't pass here
      # would be a structural red. These steps wake up on their own as soon as the manifest exists.
      - name: No package.json yet (scaffolded repo)
        if: hashFiles('package.json') == ''
        run: echo "No package.json yet — nothing to check. These steps activate once it exists."
      - run: npm ci
        if: hashFiles('package.json') != ''
      - run: npm test
        if: hashFiles('package.json') != ''
      - run: npm run typecheck
        if: hashFiles('package.json') != ''
      # The guards above are ROOT-ONLY: on a monorepo (backend/ + frontend/), `hashFiles('package.json')`
      # is empty, all three steps SKIP, and the job goes GREEN having installed, tested and compiled
      # nothing — worse than no CI, since it reads as a pass. The scaffold guard stays (a fresh repo
      # must not go red), but the SILENCE doesn't: the step below turns it red. Delete it once the
      # steps above are replaced by this repo's real workspaces (`npm ci --prefix <dir>` per workspace).
      - name: Refuse to pass silently when the npm steps were skipped
        run: |
          set -euo pipefail
          if [ -z "$(find . -name package.json -not -path '*/node_modules/*' -print -quit)" ]; then
            echo "No package.json anywhere — fresh scaffold, nothing to build."
          elif [ ! -f package.json ]; then
            echo "::error::package.json exists, but NOT at the repository root: every npm step above was SKIPPED."
            echo "::error::Replace them with the workspaces this repo has, e.g. 'for w in backend frontend; do npm ci --prefix \$w; npm run build --prefix \$w; done'."
            exit 1
          fi
      # No `npm audit` here, deliberately: it's a STRICT SUBSET of osv-scanner below — same advisory
      # database (npm audit runs on the GitHub Advisory Database since 2021; OSV aggregates GHSA
      # too), same lockfile, same job, `--omit=dev` narrower still. A subset scanner adds no signal,
      # only upkeep.
      - name: Install gitleaks (pinned + checksum-verified)
        run: |
          set -euo pipefail
          v="${GITLEAKS_VERSION#v}"   # the tag carries the `v`, the asset name does not
          f="gitleaks_${v}_linux_x64.tar.gz"
          curl -sSfL -o "$f" \
            "https://github.com/gitleaks/gitleaks/releases/download/${GITLEAKS_VERSION}/${f}"
          echo "${GITLEAKS_SHA256}  ${f}" | sha256sum -c -
          tar -xzf "$f" gitleaks
      - name: Secret scan (full history)
        run: ./gitleaks git --no-banner --redact
      - name: Lint workflows (actionlint, pinned + checksum-verified)
        run: |
          set -euo pipefail
          v="${ACTIONLINT_VERSION#v}"
          f="actionlint_${v}_linux_amd64.tar.gz"
          curl -sSfL -o "$f" \
            "https://github.com/rhysd/actionlint/releases/download/${ACTIONLINT_VERSION}/${f}"
          echo "${ACTIONLINT_SHA256}  ${f}" | sha256sum -c -
          tar -xzf "$f" actionlint
          ./actionlint -color
      - name: Static analysis (semgrep, pinned)
        run: |
          set -euo pipefail
          python3 -m pip install --quiet -r requirements-ci.txt
          semgrep scan --error --quiet --metrics=off --exclude=.github \
            --config p/security-audit --config p/owasp-top-ten .
      # osv-scanner auto-discovers every lockfile/manifest (`-r .`), not just package-lock.json;
      # `--allow-no-lockfiles` keeps it green if none are present. No guard: always runs and reports.
      - name: Vulnerable dependencies (osv-scanner, pinned + checksum-verified)
        run: |
          set -euo pipefail
          curl -sSfL -o osv-scanner \
            "https://github.com/google/osv-scanner/releases/download/${OSV_VERSION}/osv-scanner_linux_amd64"
          echo "${OSV_SHA256}  osv-scanner" | sha256sum -c -
          chmod +x osv-scanner
          ./osv-scanner scan source -r . --allow-no-lockfiles
      # zizmor overlaps CodeQL's `actions` language (GA since Apr 2025, on by default) for code-
      # injection, artifact/cache poisoning, untrusted-checkout, exposed secrets, missing-permissions.
      # What zizmor keeps ON ITS OWN: this repo's SHA-pinning policy (CodeQL's unpinned-tag query
      # needs security-extended, not default) + artipacked, impostor-commit, ref-confusion, typosquat.
      - name: Audit workflows (zizmor)
        run: |
          set -euo pipefail
          python3 -m pip install --quiet -r requirements-ci.txt
          zizmor --persona regular --config .github/zizmor.yml .github/workflows/
      # Shell is the one language every project holds regardless of toolchain (hooks, check.sh,
      # open-pr.sh, checks/). It was the only control this template ran on itself and shipped to
      # nobody: a shell bug committed here was blocked, but in a generated project it went through
      # in silence, locally AND on the server. Targets are FOUND, never listed: a forgotten one is
      # a silent hole.
      - name: shellcheck the scripts and the hooks (preinstalled on the runner)
        run: |
          mapfile -t targets < <(find . -type f -name '*.sh' -not -path './.ci-tools/*' -not -path './.git/*' -not -path './node_modules/*')
          mapfile -t -O "${#targets[@]}" targets < <(find . -type f -path './.githooks*' -not -path './.git/*')
          if [ "${#targets[@]}" -eq 0 ]; then echo "no shell here"; exit 0; fi
          printf 'shellcheck: %s\n' "${targets[@]}"
          shellcheck -S warning "${targets[@]}"
      # House checks ONLY — gitleaks, semgrep, osv-scanner, actionlint and zizmor are the pinned
      # steps above; `checks/verify-*.sh` is everything this project adds for itself.
      - name: House checks (checks/verify-*.sh, via check.sh --house)
        run: ./check.sh --house
