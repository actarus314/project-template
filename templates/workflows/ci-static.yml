# Installed as .github/workflows/ci.yml by `init-project.sh --type static`.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      GITLEAKS_VERSION: v8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
      ACTIONLINT_VERSION: v1.7.12
      ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
      OSV_VERSION: v2.4.0
      OSV_SHA256: 15314940c10d26af9c6649f150b8a47c1262e8fc7e17b1d1029b0e479e8ed8a0
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install gitleaks (pinned + checksum-verified)
        run: |
          set -euo pipefail
          v="${GITLEAKS_VERSION#v}"   # the tag carries the `v`, the asset name does not
          f="gitleaks_${v}_linux_x64.tar.gz"
          curl -sSfL -o "$f" \
            "https://github.com/gitleaks/gitleaks/releases/download/${GITLEAKS_VERSION}/${f}"
          echo "${GITLEAKS_SHA256}  ${f}" | sha256sum -c -
          tar -xzf "$f" gitleaks
      - name: Secret scan (full history)
        run: ./gitleaks git --no-banner --redact
      - name: Lint workflows (actionlint, pinned + checksum-verified)
        run: |
          set -euo pipefail
          v="${ACTIONLINT_VERSION#v}"
          f="actionlint_${v}_linux_amd64.tar.gz"
          curl -sSfL -o "$f" \
            "https://github.com/rhysd/actionlint/releases/download/${ACTIONLINT_VERSION}/${f}"
          echo "${ACTIONLINT_SHA256}  ${f}" | sha256sum -c -
          tar -xzf "$f" actionlint
          ./actionlint -color
      - name: Static analysis (semgrep, pinned)
        run: |
          set -euo pipefail
          python3 -m pip install --quiet -r requirements-ci.txt
          semgrep scan --error --quiet --metrics=off --exclude=.github \
            --config p/security-audit --config p/owasp-top-ten .
      # osv-scanner AUTO-DISCOVERS every lockfile/manifest (`-r .`); `--allow-no-lockfiles` keeps a
      # pure static site green. No `hashFiles` guard: a required check that never reports leaves
      # every PR stuck on "Expected — waiting for status", so this step always runs.
      - name: Vulnerable dependencies (osv-scanner, pinned + checksum-verified)
        run: |
          set -euo pipefail
          curl -sSfL -o osv-scanner \
            "https://github.com/google/osv-scanner/releases/download/${OSV_VERSION}/osv-scanner_linux_amd64"
          echo "${OSV_SHA256}  osv-scanner" | sha256sum -c -
          chmod +x osv-scanner
          ./osv-scanner scan source -r . --allow-no-lockfiles
      # zizmor overlaps CodeQL's `actions` language (GA since Apr 2025, on by default) for code-
      # injection, artifact/cache poisoning, untrusted-checkout, exposed secrets, missing-permissions.
      # What zizmor keeps ON ITS OWN: this repo's SHA-pinning policy (CodeQL's unpinned-tag query
      # needs security-extended, not default) + artipacked, impostor-commit, ref-confusion, typosquat.
      - name: Audit workflows (zizmor)
        run: |
          set -euo pipefail
          python3 -m pip install --quiet -r requirements-ci.txt
          zizmor --persona regular --config .github/zizmor.yml .github/workflows/
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      # Real check with no per-project wiring: syntax-check every JS file.
      - name: Syntax check (all JS)
        run: find . -name '*.js' -not -path './node_modules/*' -not -path './.git/*' -exec node --check {} +
      # Shell is the one language every project holds regardless of toolchain (hooks, check.sh,
      # open-pr.sh, checks/). It was the only control this template ran on itself and shipped to
      # nobody: a shell bug committed here was blocked, but in a generated project it went through
      # in silence, locally AND on the server. Targets are FOUND, never listed: a forgotten one is
      # a silent hole.
      - name: shellcheck the scripts and the hooks (preinstalled on the runner)
        run: |
          mapfile -t targets < <(find . -type f -name '*.sh' -not -path './.ci-tools/*' -not -path './.git/*' -not -path './node_modules/*')
          if [ -d .githooks ]; then mapfile -t -O "${#targets[@]}" targets < <(find .githooks -type f); fi
          if [ "${#targets[@]}" -eq 0 ]; then echo "no shell here"; exit 0; fi
          printf 'shellcheck: %s\n' "${targets[@]}"
          shellcheck -S warning "${targets[@]}"
      # House checks ONLY — gitleaks, semgrep, osv-scanner, actionlint and zizmor are the pinned
      # steps above; `checks/verify-*.sh` is everything this project adds for itself.
      - name: House checks (checks/verify-*.sh, via check.sh --house)
        run: ./check.sh --house
      # Uncomment the checks the project actually has:
      # - name: i18n parity
      #   run: node scripts/check-i18n.mjs
      # - name: Self-check
      #   run: node scripts/test-model.mjs
