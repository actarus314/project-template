# CI of the TEMPLATE repo itself — NOT a shipped template file: above all it GENERATES projects
# to lint their workflows in real conditions (automates the former manual test00x runs).
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions: {}

jobs:
  validate-renovate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # Pinned EXACT (checked by check.sh, same version) and bumped by Renovate itself.
      # Floor: npx's default 37.x IGNORES `managerFilePatterns` and falsely reports "invalid
      # config". Ceiling: a floating major re-resolves on every run, so `main` can go red with
      # no line changed, and brings regressions instantly with no known-good fallback.
      - name: Validate both Renovate configs
        run: |
          set -euo pipefail
          for f in .github/renovate.json templates/repo/.github/renovate.json; do
            npx --yes --package renovate@44.14.10 renovate-config-validator "$f"
          done

  lint-scripts:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          # fetch-depth 0 (verify-changelog.sh needs a merge base) and fetch-tags (verify-version.sh
          # needs the tag): both apply here, since they run via --house on this checkout.
          fetch-depth: 0
          fetch-tags: true
      # verify-travel.sh generates throwaway projects, and generating one ends in `git commit`,
      # which refuses to run without an identity. Set here for the same reason the generation job
      # sets it: a runner has none.
      - name: Git identity (verify-travel.sh generates projects, and a generation commits)
        run: |
          git config --global user.email ci@example.com
          git config --global user.name  ci
      # -S warning: these are mature scripts; report real problems (warning/error), not the info/style
      # nitpicks (SC2086 on a deliberate word-split, etc.) that would fail the job for no real defect.
      # AUTO-DETECTED, never a hand-written list: the list here was already missing a script, and a
      # forgotten target is a SILENT hole — check.sh has always found them with the same `find`, so
      # a new script was linted locally and not here, which breaks `local == github` on its own.
      - name: shellcheck the scripts, the local runner and the hooks (shellcheck is preinstalled)
        run: |
          mapfile -t targets < <(find . -type f -name '*.sh' -not -path './.ci-tools/*' -not -path './.git/*' -not -path './node_modules/*')
          mapfile -t -O "${#targets[@]}" targets < <(find . -type f -path './.githooks*' -not -path './.git/*')
          printf 'shellcheck: %s\n' "${targets[@]}"
          shellcheck -S warning "${targets[@]}"
      # Each check announces what it read; an absent target is never folded into a silent pass.
      # This job's checkout needs fetch-depth 0 too: the branch itself is in scope, not just the tree.
      - name: House checks (checks/verify-*.sh, via check.sh --house)
        run: ./check.sh --house

  generate-and-lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: static-pages,   flags: --type static --pages }
          - { name: node-full,      flags: --type node }
          - { name: generic,        flags: --type generic }
          - { name: static-artefact, flags: --type static --pages --artefact }
          - { name: static-nopages, flags: --type static --no-pages }
    env:
      # Same version+checksum the template ships (single source; Renovate keeps ci.yml and the
      # template files aligned via the extended custom.regex in .github/renovate.json).
      ACTIONLINT_VERSION: v1.7.12
      ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
      # osv is not used to lint THIS repo (no application manifest) — it serves the regression GUARD
      # further below (replaying the osv step of a generated project). Tracked by Renovate on the same
      # footing as actionlint (custom.regex also targets `.github/workflows/` — see .github/renovate.json).
      OSV_VERSION: v2.4.0
      OSV_SHA256: 15314940c10d26af9c6649f150b8a47c1262e8fc7e17b1d1029b0e479e8ed8a0
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install actionlint (pinned + checksum-verified)
        run: |
          set -euo pipefail
          v="${ACTIONLINT_VERSION#v}"
          f="actionlint_${v}_linux_amd64.tar.gz"
          curl -sSfL -o "$f" \
            "https://github.com/rhysd/actionlint/releases/download/${ACTIONLINT_VERSION}/${f}"
          echo "${ACTIONLINT_SHA256}  ${f}" | sha256sum -c -
          tar -xzf "$f" actionlint
          sudo mv actionlint /usr/local/bin/
      - name: Install zizmor (the version the template ships — single source)
        run: python3 -m pip install --quiet "$(grep '^zizmor==' templates/repo/requirements-ci.txt)"
      # The template eats its own food: it lints its OWN ci.yml under the same pin policy it
      # ships (single source, no second copy to drift). Only the workflow linters apply here —
      # semgrep needs app code and osv-scanner a lockfile, neither of which this repo has.
      # Gated to one matrix shard: the tools are already installed here; a dedicated job would
      # duplicate the pinned install for a 2-second lint.
      - name: Lint the template's OWN workflow (actionlint + zizmor, its shipped config)
        if: matrix.name == 'node-full'
        run: |
          set -euo pipefail
          actionlint -color
          zizmor --persona regular --config templates/repo/.github/zizmor.yml .github/workflows/
      - name: Generate a project (${{ matrix.name }})
        run: |
          set -euo pipefail
          # Without an identity, the `git commit` inside init-project.sh fails ("empty ident").
          git config --global user.email ci@example.com
          git config --global user.name  ci
          ./init-project.sh proj acme/proj "$RUNNER_TEMP" ${{ matrix.flags }}
      - name: No SCRIPT placeholder left unsubstituted
        run: |
          set -euo pipefail
          # SCRIPT placeholders (init-project.sh's "filet 1") MUST be gone. HUMAN placeholders
          # (<contact>, <one line>, <web-dir>…) are expected — they are filled by hand, not the script.
          proj="$RUNNER_TEMP/proj/repo"
          # Same list AND same exclusion as init-project.sh's own net — the files copied verbatim
          # from the root are never substituted, and they DOCUMENT these placeholders.
          if grep -rn '<owner>/<repo>\|<repo>\|<image-name>\|<template-version>\|<!-- BRANCHING -->' "$proj" \
             | grep -vE '/(check|open-pr|configure-repo)\.sh:|/checks/|/docs/(code|server-config\.md)'; then
            echo "::error::init-project.sh left a script placeholder unsubstituted"
            exit 1
          fi
      - name: Lint the generated workflows (actionlint + zizmor, with the project's own config)
        run: |
          set -euo pipefail
          proj="$RUNNER_TEMP/proj/repo"
          ( cd "$proj" && actionlint -color )
          zizmor --persona regular --config "$proj/.github/zizmor.yml" "$proj/.github/workflows/"
      # Regression guard for the osv scope fix (PR #23): the steps above lint a generated project's
      # workflows but never replay its osv step, which is where "CI-only tooling out of scope" lives
      # (requirements-ci.txt subtracted via .gitignore). Replaying it here means a regression — the
      # .gitignore no longer subtracting it, or a reintroduced CVE — turns THIS job red before any
      # real project ships a red osv CI. One shard suffices: the fix is the shared template
      # .gitignore, identical across every --type.
      - name: Generated project passes its own osv step (regression guard, PR #23)
        if: matrix.name == 'node-full'
        run: |
          set -euo pipefail
          curl -sSfL -o "$RUNNER_TEMP/osv-scanner" \
            "https://github.com/google/osv-scanner/releases/download/${OSV_VERSION}/osv-scanner_linux_amd64"
          echo "${OSV_SHA256}  $RUNNER_TEMP/osv-scanner" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/osv-scanner"
          ( cd "$RUNNER_TEMP/proj/repo" && "$RUNNER_TEMP/osv-scanner" scan source -r . --allow-no-lockfiles )
      - name: Generated repos are clean and secrets.md stays untracked
        run: |
          set -euo pipefail
          p="$RUNNER_TEMP/proj"
          [ -z "$(git -C "$p/repo" status --porcelain)" ]      || { echo "::error::repo/ is not clean"; exit 1; }
          [ -z "$(git -C "$p/workspace" status --porcelain)" ] || { echo "::error::workspace/ is not clean"; exit 1; }
          if git -C "$p/workspace" ls-files --error-unmatch secrets.md >/dev/null 2>&1; then
            echo "::error::secrets.md is tracked in workspace/"; exit 1
          fi

  gitleaks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      GITLEAKS_VERSION: v8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install gitleaks (pinned + checksum-verified)
        run: |
          set -euo pipefail
          v="${GITLEAKS_VERSION#v}"
          f="gitleaks_${v}_linux_x64.tar.gz"
          curl -sSfL -o "$f" \
            "https://github.com/gitleaks/gitleaks/releases/download/${GITLEAKS_VERSION}/${f}"
          echo "${GITLEAKS_SHA256}  ${f}" | sha256sum -c -
          tar -xzf "$f" gitleaks
      - name: Secret scan (full history)
        run: ./gitleaks git --no-banner --redact

  # 🔴 The ruleset requires ONE status check named `checks` (the single-gate name every generated
  # project's ci.yml uses). This repo's CI is split across several jobs, so without this
  # aggregator the check never arrives and every PR waits forever. `if: always()` makes it a real
  # gate: without it, a failed dependency would skip this job instead of reporting failure.
  checks:
    needs: [validate-renovate, lint-scripts, generate-and-lint, gitleaks]
    if: always()
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Every required job succeeded
        # Through env, never interpolated into the shell: a `${{ }}` inside a `run:` is an
        # injection vector, and zizmor rejects it.
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          set -euo pipefail
          echo "job results: $RESULTS"
          case "$RESULTS" in
            *failure*|*cancelled*|*skipped*)
              echo "::error::a required job did not succeed"; exit 1;;
          esac
