# CI of the TEMPLATE repo itself — NOT a shipped gabarit.
# It validates the scripts and the Renovate config, and above all GENERATES projects to lint their
# workflows in real conditions — the automation of the manual test00x runs. This is what gives the
# PR-only switch its meaning: the pre-push hook points here ("check the CI is green").
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions: {}

jobs:
  validate-renovate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # Pinned EXACT, and bumped by Renovate itself (custom.regex + npm datasource, automerged —
      # `check.sh` carries the same version and is covered by the same manager).
      # The floor matters: the version npx resolves by default (37.x) IGNORES `managerFilePatterns`
      # and reports a FALSE "invalid config" — a validator that lies is worse than none.
      # The ceiling matters just as much: a floating major re-resolves the newest release ON EVERY
      # RUN, so `main` can go red without a line changing. A floating range does not only hand you
      # the fixes — it hands you the regressions too, instantly, with NO known-good version to fall
      # back to.
      - name: Validate both Renovate configs
        run: |
          set -euo pipefail
          for f in .github/renovate.json templates/repo/.github/renovate.json; do
            npx --yes --package renovate@43.278.0 renovate-config-validator "$f"
          done

  lint-scripts:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # -S warning: these are mature scripts; report real problems (warning/error), not the info/style
      # nitpicks (SC2086 on a deliberate word-split, etc.) that would fail the job for no real defect.
      - name: shellcheck the scripts, the local runner and the hooks (shellcheck is preinstalled)
        run: shellcheck -S warning init-project.sh configure-repo.sh check.sh .githooks/pre-commit .githooks/pre-push

  generate-and-lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: static-pages,   flags: --type static --pages }
          - { name: node-full,      flags: --type node }
          - { name: generic,        flags: --type generic }
          - { name: rozo,           flags: --type static --pages --artefact }
          - { name: static-nopages, flags: --type static --no-pages }
    env:
      # Same version+checksum the template ships (single source; Renovate keeps ci.yml and the
      # gabarits aligned via the extended custom.regex in .github/renovate.json).
      ACTIONLINT_VERSION: v1.7.12
      ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
      # osv n'est pas utilisé pour linter CE repo (pas de manifeste applicatif) — il sert à la GARDE
      # anti-régression plus bas (rejouer l'étape osv d'un projet généré). Suivi par Renovate au même
      # titre qu'actionlint (custom.regex cible aussi `.github/workflows/` — voir .github/renovate.json).
      OSV_VERSION: v2.4.0
      OSV_SHA256: 15314940c10d26af9c6649f150b8a47c1262e8fc7e17b1d1029b0e479e8ed8a0
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install actionlint (pinned + checksum-verified)
        run: |
          set -euo pipefail
          v="${ACTIONLINT_VERSION#v}"
          f="actionlint_${v}_linux_amd64.tar.gz"
          curl -sSfL -o "$f" \
            "https://github.com/rhysd/actionlint/releases/download/${ACTIONLINT_VERSION}/${f}"
          echo "${ACTIONLINT_SHA256}  ${f}" | sha256sum -c -
          tar -xzf "$f" actionlint
          sudo mv actionlint /usr/local/bin/
      - name: Install zizmor (the version the template ships — single source)
        run: python3 -m pip install --quiet "$(grep '^zizmor==' templates/repo/requirements-ci.txt)"
      # The template must eat its own food: it imposes actionlint + zizmor on every generated
      # project, so it runs them on its OWN ci.yml too, under the very pin policy it ships
      # (templates/repo/.github/zizmor.yml — single source, no second copy to drift). Only the
      # workflow linters apply here: semgrep needs app code and osv-scanner a lockfile, neither
      # of which this scripts-and-docs repo has.
      # ponytail: gated to one matrix shard — the tools are already installed here; a dedicated
      # job would duplicate the pinned install for a 2-second lint.
      - name: Lint the template's OWN workflow (actionlint + zizmor, its shipped config)
        if: matrix.name == 'node-full'
        run: |
          set -euo pipefail
          actionlint -color
          zizmor --persona regular --config templates/repo/.github/zizmor.yml .github/workflows/
      - name: Generate a project (${{ matrix.name }})
        run: |
          set -euo pipefail
          # Without an identity, the `git commit` inside init-project.sh fails ("empty ident").
          git config --global user.email ci@example.com
          git config --global user.name  ci
          ./init-project.sh proj acme/proj "$RUNNER_TEMP" ${{ matrix.flags }}
      - name: No SCRIPT placeholder left unsubstituted
        run: |
          set -euo pipefail
          # SCRIPT placeholders (init-project.sh's "filet 1") MUST be gone. HUMAN placeholders
          # (<contact>, <one line>, <web-dir>…) are expected — they are filled by hand, not the script.
          proj="$RUNNER_TEMP/proj/repo"
          if grep -rn '<owner>/<repo>\|<repo>\|<image-name>\|<!-- BRANCHING -->' "$proj"; then
            echo "::error::init-project.sh left a script placeholder unsubstituted"
            exit 1
          fi
      - name: Lint the generated workflows (actionlint + zizmor, with the project's own config)
        run: |
          set -euo pipefail
          proj="$RUNNER_TEMP/proj/repo"
          ( cd "$proj" && actionlint -color )
          zizmor --persona regular --config "$proj/.github/zizmor.yml" "$proj/.github/workflows/"
      # Regression guard for the osv fix (PR #23). The steps above lint a generated project's WORKFLOWS,
      # but never replay its osv step — which is exactly where the "CI-only tooling out of scope" fix
      # lives (requirements-ci.txt subtracted via .gitignore). So replay that project's EXACT osv step on
      # the freshly generated tree: if the gabarit .gitignore ever stops subtracting requirements-ci.txt
      # (or a bump reintroduces tooling CVEs), THIS job goes red — before any real project ships a red
      # osv CI. The `git add -f` itself is already guarded by the "repo clean" check below (an uncommitted
      # file leaves `git status` dirty). One shard suffices: the fix is driven by the shared gabarit
      # .gitignore, identical across every --type.
      - name: Generated project passes its own osv step (regression guard, PR #23)
        if: matrix.name == 'node-full'
        run: |
          set -euo pipefail
          curl -sSfL -o "$RUNNER_TEMP/osv-scanner" \
            "https://github.com/google/osv-scanner/releases/download/${OSV_VERSION}/osv-scanner_linux_amd64"
          echo "${OSV_SHA256}  $RUNNER_TEMP/osv-scanner" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/osv-scanner"
          ( cd "$RUNNER_TEMP/proj/repo" && "$RUNNER_TEMP/osv-scanner" scan source -r . --allow-no-lockfiles )
      - name: Generated repos are clean and secrets.md stays untracked
        run: |
          set -euo pipefail
          p="$RUNNER_TEMP/proj"
          [ -z "$(git -C "$p/repo" status --porcelain)" ]      || { echo "::error::repo/ is not clean"; exit 1; }
          [ -z "$(git -C "$p/workspace" status --porcelain)" ] || { echo "::error::workspace/ is not clean"; exit 1; }
          if git -C "$p/workspace" ls-files --error-unmatch secrets.md >/dev/null 2>&1; then
            echo "::error::secrets.md is tracked in workspace/"; exit 1
          fi

  gitleaks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      GITLEAKS_VERSION: v8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install gitleaks (pinned + checksum-verified)
        run: |
          set -euo pipefail
          v="${GITLEAKS_VERSION#v}"
          f="gitleaks_${v}_linux_x64.tar.gz"
          curl -sSfL -o "$f" \
            "https://github.com/gitleaks/gitleaks/releases/download/${GITLEAKS_VERSION}/${f}"
          echo "${GITLEAKS_SHA256}  ${f}" | sha256sum -c -
          tar -xzf "$f" gitleaks
      - name: Secret scan (full history)
        run: ./gitleaks git --no-banner --redact
